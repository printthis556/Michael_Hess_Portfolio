<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preload" as="image" href="images/Lightning background (1)-optimized.webp" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume | Michael Hess Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .dropdown-menu a:hover {
            background: rgba(34, 48, 68, 0.92);
            color: #aad8ff;
        }
        .dropdown-menu a {
            color: #fff !important;
        }
        .dropdown-menu {
            background: rgba(20,24,34,0.97);
            min-width: 180px;
            box-shadow: 0 10px 35px rgba(0,0,0,.35);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            z-index: 1001;
        }
            body {
                background: url('images/Lightning background (1)-optimized.webp') no-repeat center center fixed;
                background-size: cover;
            }
        .blur-bg {
            position: fixed; inset: 0; z-index: 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(12,16,24,0.45);
        }
        .menu-container { position: absolute; top: 20px; right: 30px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="blur-bg"></div>
    <div class="menu-container">
        <button class="menu-btn" onclick="toggleMenu()">Menu &#9776;</button>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="skills.html">Skills</a>
            <a href="certification.html">Certifications | Awards</a>
            <a href="resume.html">Resume</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
    <main style="position:relative;z-index:1;">
        <h1 style="color:#fff;text-align:center;margin-top:5em;">Resume</h1>
        <div style="display:flex;justify-content:center;align-items:center;margin-top:3em;">
            <div style="background:rgba(20,24,34,0.82);border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,0.22);border:2px solid rgba(170,216,255,0.18);padding:2em;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;">
                <img id="resumeImg" src="images/12-10-25 reume screenshot.png" alt="Resume" style="max-width:420px;width:100%;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.18);margin:0 auto;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'" loading="lazy" decoding="async" />
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">Michael Hess</div>
            <nav class="footer-links" aria-label="Footer">
                <a href="index.html" aria-label="Home" data-label="Home">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5v8.5a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span class="sr-only">Home</span>
                </a>
                <a href="projects.html" aria-label="Projects" data-label="Projects">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6a1 1 0 0 1 1 1v2h5a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1h5V5a1 1 0 0 1 1-1zm1 3h4V6h-4z"/></svg>
                    <span class="sr-only">Projects</span>
                </a>
                <a href="skills.html" aria-label="Skills" data-label="Skills">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3a5 5 0 0 0-3.9 8.1L3 18.7 5.3 21l7.6-7.6A5 5 0 0 0 21 9.5l-4 2-2-2 2-4A5 5 0 0 0 14.5 3z"/></svg>
                    <span class="sr-only">Skills</span>
                </a>
                <a href="certification.html" aria-label="Certifications" data-label="Certifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 2v4a7 7 0 0 1-5 6.7A7 7 0 0 1 7 9V5z"/><path d="M8 14l-1 7 5-3 5 3-1-7"/></svg>
                    <span class="sr-only">Certifications</span>
                </a>
                <a href="resume.html" aria-label="Resume" data-label="Resume">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 1v4h4"/><path d="M8 12h8v1H8zm0 4h8v1H8z"/></svg>
                    <span class="sr-only">Resume</span>
                </a>
                <a href="contact.html" aria-label="Contact" data-label="Contact">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm0 2l9 6 9-6v-1H3z"/></svg>
                    <span class="sr-only">Contact</span>
                </a>
            </nav>
            <div class="footer-meta">(c) 2026 Michael Hess. Built with HTML, CSS, and JavaScript.</div>
        </div>
    </footer>

    <!-- Resume Modal -->
    <div id="resumeModal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center;">
        <div style="background:rgba(20,24,34,0.95);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:2px solid rgba(170,216,255,0.25);padding:2em;max-width:90vw;max-height:90vh;overflow:auto;position:relative;">
            <button onclick="closeResumeModal()" style="position:absolute;top:15px;right:15px;background:rgba(170,216,255,0.2);border:1px solid rgba(170,216,255,0.4);color:#aad8ff;padding:0.5em 0.8em;border-radius:8px;font-size:1.2em;cursor:pointer;transition:background 0.2s;">✕</button>
            <img src="images/12-10-25 reume screenshot.png" alt="Resume" style="max-width:100%;width:100%;border-radius:12px;display:block;" loading="lazy" decoding="async" />
        </div>
    </div>
    <script>
        function toggleMenu() {
            var menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }
        window.addEventListener('click', function(event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName('dropdown-menu');
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.style.display === 'block') {
                        openDropdown.style.display = 'none';
                    }
                }
            }
        });

        // Resume Modal Functions
        document.getElementById('resumeImg').addEventListener('click', function() {
            document.getElementById('resumeModal').style.display = 'flex';
        });

        function closeResumeModal() {
            document.getElementById('resumeModal').style.display = 'none';
        }

        // Close modal when clicking outside the modal content
        document.getElementById('resumeModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeResumeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeResumeModal();
            }
        });
    </script>
</body>
</html>
